start_version: "0.1.0"

suffixes:
  dev: "-dev"
  staging: "-rc"
  master: ""

promotions:
  - from_branch: dev
    to_branch: staging
    auto_promote: true
  - from_branch: staging
    to_branch: master
    auto_promote: false

version_files:
  - "version.txt"

pull_request:
  title: "Release {{version}}"
  labels:
    - "semver-bump"
