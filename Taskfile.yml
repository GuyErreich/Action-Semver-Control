version: '3'

set: [errexit, pipefail]

tasks:
  init:
    desc: Initialize project with Python version
    cmds:
      - uv python pin 3.12
    generates:
      - .python-version

  install:
    desc: Install dependencies with uv
    cmds:
      - uv sync --dev
    sources:
      - pyproject.toml
      - uv.lock

  audit:
    desc: Audit locked dependencies with uv
    cmds:
      - uv audit --frozen

  format:
    desc: Format code with ruff
    cmds:
      - uv run ruff format .

  lint:
    desc: Lint code with ruff
    cmds:
      - uv run ruff check .
    

  type-check:
    desc: Run mypy type checks
    cmds:
      - uv run mypy src tests

  test:
    desc: Run pytest
    cmds:
      - echo "Running tests..."
      - uv run pytest -s

  all:
    desc: Run all checks
    deps: [format, lint, type-check, test, audit]

  pre-commit:
    desc: Install and run pre-commit hooks (gitleaks, private-key scan)
    cmds:
      - uv run pre-commit install
      - uv run pre-commit run --all-files
