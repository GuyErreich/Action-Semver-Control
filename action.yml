name: 'Auto Semver Bumper'
description: 'Automatically bump semver, update changelogs, and open release PRs on merge.'
branding:
  icon: tag
  color: blue

inputs:
  action:
    required: false
    description: 'Action to perform: bump (default), promote'
    default: 'bump'
  to_branch:
    required: false
    description: 'Target branch (for promote)'
  from_tag:
    required: false
    description: 'Source tag (for promote)'
  dry_run:
    required: false
    description: 'Dry run mode'
    default: 'false'
  github-token:
    required: true
    description: 'GitHub Token (GitHub App installation token recommended)'
  debug:
    required: false
    description: 'Enable debug mode'
  signed-commits:
    required: false
    description: 'Create verified commits via the GitHub API (requires App installation token)'
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install auto-semver
      id: install
      shell: bash
      run: |
        set -euo pipefail
        pkg="${GITHUB_ACTION_PATH}"
        uv_version="$(tr -d '[:space:]' < "${pkg}/.uv-version")"
        install_dir="${RUNNER_TEMP}/auto-semver-uv"
        bin_dir="${RUNNER_TEMP}/auto-semver-bin"
        curl -LsSf "https://astral.sh/uv/${uv_version}/install.sh" \
          | env UV_INSTALL_DIR="${install_dir}" UV_NO_MODIFY_PATH=1 sh
        UV_TOOL_BIN_DIR="${bin_dir}" UV_TOOL_DIR="${RUNNER_TEMP}/auto-semver-tools" \
          "${install_dir}/uv" tool install "${pkg}"
        echo "bin=${bin_dir}/auto-semver" >> "${GITHUB_OUTPUT}"

    - name: Run auto-semver
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        AUTO_SEMVER_BIN: ${{ steps.install.outputs.bin }}
        AUTO_SEMVER_TOKEN: ${{ inputs.github-token }}
        AUTO_SEMVER_ACTION: ${{ inputs.action }}
        AUTO_SEMVER_TO_BRANCH: ${{ inputs.to_branch }}
        AUTO_SEMVER_FROM_TAG: ${{ inputs.from_tag }}
        AUTO_SEMVER_DRY_RUN: ${{ inputs.dry_run }}
        AUTO_SEMVER_DEBUG: ${{ inputs.debug }}
        AUTO_SEMVER_SIGNED: ${{ inputs.signed-commits }}
      run: |
        set -euo pipefail
        bin="${AUTO_SEMVER_BIN}"
        args=(--github-token "${AUTO_SEMVER_TOKEN}")
        if [[ "${AUTO_SEMVER_DEBUG}" == "true" ]]; then
          args+=(--debug)
        fi
        if [[ "${AUTO_SEMVER_SIGNED}" == "true" ]]; then
          args+=(--signed-commits)
        fi
        if [[ "${AUTO_SEMVER_ACTION}" == "promote" ]]; then
          args+=(promote --to-branch "${AUTO_SEMVER_TO_BRANCH}" --from-tag "${AUTO_SEMVER_FROM_TAG}")
          if [[ "${AUTO_SEMVER_DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi
        fi
        env -u UV_PROJECT_ENVIRONMENT -u UV_FROZEN "${bin}" "${args[@]}"
