name: 'Auto Semver Bumper'
description: 'Automatically bump semver, update changelogs, and open release PRs on merge.'
branding:
  icon: tag
  color: blue

inputs:
  action:
    required: false
    description: 'Action to perform: bump (default), promote'
    default: 'bump'
  to_branch:
    required: false
    description: 'Target branch (for promote)'
  from_tag:
    required: false
    description: 'Source tag (for promote)'
  dry_run:
    required: false
    description: 'Dry run mode'
    default: 'false'
  github-token:
    required: true
    description: 'GitHub Token (GitHub App installation token recommended)'
  debug:
    required: false
    description: 'Enable debug mode'
  signed-commits:
    required: false
    description: 'Create verified commits via the GitHub API (requires App installation token)'
    default: 'false'

runs:
  using: composite
  steps:
    - name: Prepare version files
      shell: bash
      env:
        AUTO_SEMVER_PHASE: prepare
      run: bash "$GITHUB_ACTION_PATH/scripts/action-engine.sh"

    - name: Sync lockfiles with the runner CLI
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/sync-host-locks.sh"

    - name: Commit release
      shell: bash
      env:
        AUTO_SEMVER_PHASE: commit
      run: bash "$GITHUB_ACTION_PATH/scripts/action-engine.sh"
