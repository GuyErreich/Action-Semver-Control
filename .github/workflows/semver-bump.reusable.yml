name: Semver Bump (Reusable)

on:
  workflow_call:
    inputs:
      debug:
        description: Enable debug logging in the semver action
        required: false
        type: boolean
        default: false
      runs-on:
        description: Runner label
        required: false
        type: string
        default: ubuntu-latest
      action-ref:
        description: Action-Semver-Control ref (tag, branch, or SHA)
        required: false
        type: string
        default: v1
      setup-url:
        description: Setup documentation URL for preflight errors
        required: false
        type: string
        default: https://github.com/GuyErreich/Action-Semver-Control/blob/dev/docs/SETUP.md
    secrets:
      app-id:
        description: GitHub App ID (GH_APP_ID)
        required: true
      app-private-key:
        description: GitHub App private key PEM (GH_APP_PRIVATE_KEY)
        required: true

permissions:
  contents: write
  pull-requests: write

# Serialize reusable bump jobs when invoked directly (callers should also set concurrency).
concurrency:
  group: auto-semver-bump-${{ github.repository }}-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Preflight GitHub App secrets
        uses: GuyErreich/Action-Semver-Control/.github/actions/preflight-app-secrets@${{ inputs.action-ref }}
        with:
          app-id: ${{ secrets.app-id }}
          app-private-key: ${{ secrets.app-private-key }}
          setup-url: ${{ inputs.setup-url }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get GitHub App Token
        uses: GuyErreich/Action-Semver-Control/.github/actions/app-authentication@${{ inputs.action-ref }}
        id: app-token
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}

      - name: Configure Git for App
        shell: bash
        run: |
          git config user.name "${{ steps.app-token.outputs.user-name }}"
          git config user.email "${{ steps.app-token.outputs.user-email }}"
          git remote set-url origin "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git"

      - name: Run Auto Semver Action
        uses: GuyErreich/Action-Semver-Control@${{ inputs.action-ref }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          debug: ${{ inputs.debug }}
