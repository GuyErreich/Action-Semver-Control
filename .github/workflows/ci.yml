name: CI

permissions:
  contents: read

on:
  pull_request:
    branches:
      - staging
      - dev

jobs:
  changes:
    name: Detect Python changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # pull_request checks out a merge commit; depth 2 includes its parents.
        fetch-depth: 2

    - name: Detect Python-related changes
      id: filter
      run: |
        set -euo pipefail
        files="$(git diff --name-only --no-renames HEAD^1 HEAD)"
        python=false
        if [ -n "$files" ]; then
          echo "Changed files:"
          printf '%s\n' "$files"
        fi
        while IFS= read -r file; do
          [ -z "$file" ] && continue
          case "$file" in
            *.py|pyproject.toml|*/pyproject.toml|uv.lock|*/uv.lock|.python-version|*/.python-version|.uv-version|*/.uv-version|Taskfile.yml|.github/workflows/ci.yml)
              python=true
              break
              ;;
          esac
        done <<< "$files"
        echo "python=$python" >> "$GITHUB_OUTPUT"
        echo "Python-related changes: $python"

  ci:
    name: Python ${{ matrix.python-version }}
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Read uv pin
      id: uv-pin
      run: echo "version=$(tr -d '[:space:]' < .uv-version)" >> "$GITHUB_OUTPUT"

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        python-version: ${{ matrix.python-version }}
        version: ${{ steps.uv-pin.outputs.version }}

    - name: Cache tool caches (mypy, ruff, pytest)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .mypy_cache
          .ruff_cache
          .pytest_cache
        key: ${{ runner.os }}-tool-caches-${{ matrix.python-version }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-tool-caches-${{ matrix.python-version }}-

    - name: Cache Task binary
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /usr/local/bin/task
        key: ${{ runner.os }}-task-${{ hashFiles('install-task.sh') }}

    - name: Install Task (Go task runner)
      run: ./install-task.sh

    - name: Install dependencies
      run: task install

    - name: Dependency audit
      run: task audit

    - name: Format code
      run: task format

    - name: Lint code
      run: task lint

    - name: Type check
      run: task type-check

    - name: Run tests
      run: task test

  python-ci:
    name: Python CI
    needs: [changes, ci]
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    steps:
    - name: Evaluate Python CI
      env:
        CI_RESULT: ${{ needs.ci.result }}
      run: |
        set -euo pipefail
        case "$CI_RESULT" in
          success|skipped)
            echo "Python CI result: $CI_RESULT"
            exit 0
            ;;
          *)
            echo "Python CI result: $CI_RESULT"
            exit 1
            ;;
        esac