name: Publish Release - Production

on:
  push:
    tags:
      - '*.*.*'
      - '!*.*.*-rc'
      - '!*.*.*-dev'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Dynamically set environment based on branch
    environment: 'production'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to fetch tags
          persist-credentials: false

      - name: Get GitHub App Token
        uses: ./.github/actions/app-authentication
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: GH Release
        uses: ./.github/actions/gh-release
        with:
          github_token: ${{ steps.app-token.outputs.token }}

      - name: Update floating v1 tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "${{ steps.app-token.outputs.user-name }}"
          git config user.email "${{ steps.app-token.outputs.user-email }}"
          git tag -fa v1 "${GITHUB_REF_NAME}"
          git push origin v1 --force
          echo "Updated v1 tag to ${GITHUB_REF_NAME}"