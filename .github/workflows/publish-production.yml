name: Publish Release - Production

on:
  push:
    tags:
      - '*.*.*'
      - '!*.*.*-rc'
      - '!*.*.*-dev'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    # Dynamically set environment based on branch
    environment: 'production'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Required to fetch tags
          persist-credentials: false

      - name: Get GitHub App Token
        uses: ./.github/actions/app-authentication
        id: app-token
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: GH Release
        uses: ./.github/actions/gh-release
        with:
          github_token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git for App
        run: |
          git config user.name "${{ steps.app-token.outputs.user-name }}"
          git config user.email "${{ steps.app-token.outputs.user-email }}"
          git remote set-url origin https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git

      - name: Update floating v1 tag
        run: |
          set -euo pipefail
          COMMIT_SHA=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          git tag -fa v1 \
            -m "Floating v1 pointer to ${GITHUB_REF_NAME}" \
            "${COMMIT_SHA}"
          git push origin refs/tags/v1 --force
          echo "Updated v1 tag to ${GITHUB_REF_NAME} (${COMMIT_SHA})"

      - name: Read uv pin
        id: uv-pin
        run: echo "version=$(tr -d '[:space:]' < .uv-version)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ steps.uv-pin.outputs.version }}

      - name: Publish package to PyPI
        run: uv build && uv publish
