name: Validate Stateless App Token

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "X-GitHub-Stateless-S2S-Token override (enabled = JWT format, disabled = classic)"
        required: true
        type: choice
        options:
          - enabled
          - disabled

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Validate token format and consumers
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
        run: |
          owner="${{ github.repository_owner }}"
          repo="${{ github.event.repository.name }}"
          uv run python scripts/validate_stateless_token.py \
            --mode "${{ inputs.mode }}" \
            --owner "${owner}" \
            --repo "${repo}"
